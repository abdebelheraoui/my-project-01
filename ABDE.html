    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 1rem;
    }

    .container {
      background: rgba(255, 255, 255, 0.12);
      padding: 2.5rem 3rem;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      backdrop-filter: blur(12px);
      animation: fadeIn 1s ease-in-out;
      position: relative;
      z-index: 10;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
      text-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .quote-box {
      min-height: 180px;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      transition: all 0.5s ease;
    }

    #quote {
      font-size: 1.4rem;
      line-height: 1.7;
      animation: fadeIn 1s ease-in;
      font-weight: 400;
    }

    .author {
      margin-top: 1rem;
      font-style: italic;
      font-size: 1rem;
      opacity: 0.8;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.9rem 1.8rem;
      border: none;
      border-radius: 25px;
      background: #fff;
      color: #764ba2;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    button:hover {
      background: #764ba2;
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 7px 20px rgba(0,0,0,0.2);
    }

    button:active {
      transform: translateY(-1px);
    }

    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .quote-counter {
      margin-top: 1rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Floating circles background effect */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      animation: float 15s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
      50% { transform: translateY(-30px) rotate(180deg); opacity: 1; }
      100% { transform: translateY(0) rotate(360deg); opacity: 0.7; }
    }

    /* Responsive design */
    @media (max-width: 600px) {
      .container {
        padding: 2rem 1.5rem;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      #quote {
        font-size: 1.2rem;
      }
      
      .controls {
        flex-direction: column;
        align-items: center;
      }
      
      button {
        width: 100%;
        max-width: 250px;
      }
    }
  </style>
</head>

    let currentIndex = 0;

    function getDailyQuote() {
      const today = new Date();
      const index = today.getDate() % quotes.length;
      currentIndex = index;
      return quotes[index];
    }

    function getRandomQuote() {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      currentIndex = randomIndex;
      return quotes[randomIndex];
    }

    const quoteElement = document.getElementById("quote");
    const authorElement = document.getElementById("author");
    const counterElement = document.getElementById("counter");
    const newQuoteBtn = document.getElementById("newQuoteBtn");
    const shareBtn = document.getElementById("shareBtn");

    function showQuote(quoteObj) {
      quoteElement.innerText = quoteObj.text;
      authorElement.innerText = `— ${quoteObj.author}`;
      counterElement.innerText = `Quote ${currentIndex + 1} of ${quotes.length}`;
      
      // Add animation effect
      document.querySelector('.quote-box').style.transform = 'scale(1.02)';
      setTimeout(() => {
        document.querySelector('.quote-box').style.transform = 'scale(1)';
      }, 300);
    }

    function showDailyQuote() {
      const dailyQuote = getDailyQuote();
      showQuote(dailyQuote);
    }

    function showRandomQuote() {
      const randomQuote = getRandomQuote();
      showQuote(randomQuote);
    }

      if (navigator.share) {
        navigator.share({
          title: 'Daily Motivation',
          text: textToShare,
          url: window.location.href
        })
        .catch(err => {
          console.log('Error sharing:', err);
          fallbackShare(textToShare);
        });
      } else {
        fallbackShare(textToShare);
      }
    }

    function fallbackShare(text) {
      // Copy to clipboard as fallback
      navigator.clipboard.writeText(text)
        .then(() => {
          alert('Quote copied to clipboard!');
        })
        .catch(err => {
          console.error('Failed to copy: ', err);
          prompt('Copy this quote:', text);
        });
    }

    // Event listeners
    newQuoteBtn.addEventListener("click", showRandomQuote);
    shareBtn.addEventListener("click", shareQuote);

    // Show quote on load
    window.addEventListener('load', showDailyQuote);
  </script>
</body>

</html>
